# Cross-referencing stream parameters — CONFIG, not code (rule 3).
# Consumed by L3 cross-referencing. Built one stream at a time: S2 first (free).

# If fewer than this share of the attempted streams return usable evidence, the
# engine re-queries S1/S2 with a BROADENED market-term set before deciding the
# coverage is genuinely low (E2). CONFIG, not code.
min_stream_coverage: 0.5

s2_patents:
  # Years of filing history used to estimate the field's filing-trend slope.
  filing_window_years: 5
  # Cap on neighbouring patents turned into evidence records per run (politeness
  # + signal-to-noise; the density count itself is uncapped).
  max_neighbours: 10
  # Citing-entity classification (E4): bucket each citing applicant into
  # corporate / academic / other to tell *industry* adoption from academic
  # lineage. CONFIG, not code — extend the marker lists without touching code.
  # Matching is case-insensitive and word-boundary safe. Omit to use the
  # built-in defaults (see streams/entities.py).
  entity_classification:
    academic_markers:
      [university, università, universität, universite, universidad, institute,
       institut, college, école, ecole, polytechnic, politecnico, academy,
       accademia, fraunhofer, "max planck", cnrs, csic, "research council",
       "research centre", "research center", "national laboratory", hospital,
       klinik]
    corporate_markers:
      [inc, ltd, limited, gmbh, llc, corp, corporation, co, ag, sa, spa, srl,
       bv, oy, ab, plc, kk, kabushiki, pty, company, technologies, systems,
       electronics, semiconductor, pharmaceuticals, industries, holdings]

s3_roadmaps:
  # Curated, indexed corpus of roadmaps / standards / regulations (public data).
  corpus_path: data/s3_corpus.jsonl
  # How many top matches to keep, and the minimum retrieval score to count as pull.
  top_k: 5
  min_score: 0.05

s1_funding:
  # Dealroom/Crunchbase funding flows — LICENSED, built last. Only DERIVED
  # aggregates are stored as evidence; raw licensed records are never persisted.
  # Credentials come from the environment (FORGE_DEALROOM_API_KEY), never here.
  funding_window_years: 3
  max_investors: 10
  base_url: "https://api.dealroom.co/api/v2"
