# Cross-referencing stream parameters — CONFIG, not code (rule 3).
# Consumed by L3 cross-referencing. Built one stream at a time: S2 first (free).

s2_patents:
  # Years of filing history used to estimate the field's filing-trend slope.
  filing_window_years: 5
  # Cap on neighbouring patents turned into evidence records per run (politeness
  # + signal-to-noise; the density count itself is uncapped).
  max_neighbours: 10

s3_roadmaps:
  # Curated, indexed corpus of roadmaps / standards / regulations (public data).
  corpus_path: data/s3_corpus.jsonl
  # How many top matches to keep, and the minimum retrieval score to count as pull.
  top_k: 5
  min_score: 0.05
