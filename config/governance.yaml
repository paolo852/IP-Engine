# Governance policy — RBAC, data residency, and data protection (GDPR / rule 4).
# Cross-cutting: enforced at the engine's seams (CLI authorization, ingest,
# hosted-LLM calls). CONFIG, not code.

# Environment mode. 'development' permits SYNTHETIC/PUBLIC data only (rule 4);
# personal/confidential portfolios (e.g. invention disclosures) require
# 'production_eu' under GDPR / EU-hosting protocols.
mode: development

data_protection:
  # Asset types that may carry personal/confidential data — blocked in development.
  restricted_asset_types: [disclosure]
  # Source licence classes permitted for stored ASSETS in development.
  dev_allowed_licences: [free, public, synthetic]

contacts:
  # Personal contact data in the Relationship Graph (person, email) is the
  # highest-sensitivity record — behind a STRICTER gate than company-level graph
  # view. Revealing a contact needs the 'view_contacts' permission AND a recorded
  # lawful basis, and is disabled entirely in development (the dev graph is
  # synthetic — rule 6). Company-level matching must work with contacts hidden.
  enabled_in_dev: false
  require_lawful_basis: true

residency:
  # EU-hosting is preferred for hosted-LLM calls. In production_eu set this true
  # to ENFORCE (block non-EU endpoints); in development it is advisory (warns).
  require_eu_hosting: false
  # Substrings that mark an LLM base_url as EU-hosted.
  eu_host_markers: ["eu.", ".eu/", "europe", "eu-"]

rbac:
  # role -> permissions. 'admin' implies every permission. Company-level graph
  # view (view_graph) is broad; view_contacts (personal data) is admin-only by
  # default — the stricter gate the graph's GDPR posture requires.
  roles:
    viewer:    [view, view_graph]
    analyst:   [view, ingest, run_pipeline, view_graph, match, validate, record_trl]
    committee: [view, decide, record_outcome, view_graph, validate]
    admin:     [admin]
