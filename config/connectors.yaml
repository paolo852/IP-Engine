# Connector settings — CONFIG, NOT CODE (rule 3). Endpoints, formats, and
# politeness limits are editable here, never hard-coded. Credentials are NOT
# stored here; they live in the environment (rule: no secrets in source).

epo_ops:
  # EPO Open Patent Services (free, documented). The first stream built (S2).
  base_url: "http://ops.epo.org/3.2/rest-services"
  auth_url: "https://ops.epo.org/3.2/auth/accesstoken"
  # Reference format used for lookups: "epodoc" or "docdb".
  reference_format: epodoc
  request_timeout_seconds: 30
  # OPS enforces throttling/quotas; minimum spacing between calls (politeness).
  min_request_interval_seconds: 1.0
  # L2 source_layer tag stamped on assets from this connector.
  source_layer: "L1.epo_ops"

cordis:
  # CORDIS — EU research-results portal (public open data, CC BY). Project
  # results / Key Exploitable Results are ingested as `project_result` assets.
  # No credentials: the data is public.
  base_url: "https://cordis.europa.eu/api/search/results"
  # Projects endpoint — participating organisations drive Layer-0 graph population.
  projects_base_url: "https://cordis.europa.eu/api/search/projects"
  request_timeout_seconds: 30
  source_layer: "L1.cordis"
