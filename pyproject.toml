[project]
name = "forge-mining-engine"
version = "0.1.0"
description = "FORGE Mining Engine — ranks and evidences dormant intellectual assets for valorisation."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "anthropic>=0.40",
]

[project.scripts]
forge = "forge.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
